# satellite_config.ini -- what satl may use on this machine. PLAN.md §4.5.
#
# NOT A SAMPLE. Like every other file in example/, this is what a milestone
# means by done: M6 reads it, `satl --limits example/satellite_config.ini`
# prints what it made of it, and tests/limits_test reads this exact file.
#
# WHERE IT GOES. satl looks for `satellite_config.ini` beside its own binary --
# $HOME/.satl/satellite_config.ini for an ordinary install (PLAN §5). It does
# NOT look in the working directory: a config picked up from `.` would mean
# that running satl in one directory and another gives a program different
# memory, silently, and DESIGN §1.1 refuses exactly that.
#
# A line is NAME=VALUE, a `#` or `;` comment, or blank. There are no
# [sections]. A file with anything else in it is refused whole, with a code, a
# line and a caret -- `satl --limits example/broken_config.ini` is that, eight
# times over.
#
# THE SHOUTED NAMES ARE MACHINE SETTINGS AND THE QUIET ONES ARE THE LANGUAGE'S.
# THREAD_COUNT, CORE_COUNT and MEMORY_MAX are in no numbering and no program can
# read them. The four below them are satellite.library.system.*, `1 14 2 1` to
# `1 14 2 4`, which `satl --words satellite.library.system` will find, and which
# a running program reads and retunes from M8 onward.

# The machine this was written on, measured 2026-08-27: Intel Xeon E5-2670 v3,
# one socket, 24 hardware threads over 12 physical cores.
#
# THREAD_COUNT is what satl MAY USE and not what the machine HAS. The two are
# allowed to differ -- ask for fewer to leave the machine some room, or for more
# if the work blocks on a disk. `satl --limits` prints both side by side.
THREAD_COUNT=24
CORE_COUNT=12

# A UNIT IS PART OF THE VALUE AND A BARE NUMBER IS REFUSED, because 61.9 GiB and
# 64.9 GB are the same memory and a bare number cannot say which was meant.
# B, KiB, MiB, GiB and TiB are powers of 1024; KB, MB, GB and TB are powers of
# 1000. Whole numbers of units only: write the next unit down rather than a
# fraction, so that the byte count is exact and not rounded behind your back.
#
# This machine has 61.9 GiB. 48 GiB leaves the rest of it alone; with no line
# here at all the ceiling is the whole machine, and a line asking for more than
# the machine has is clamped to it and said so.
MEMORY_MAX=48GiB

# The only dial anything reads at M6: the watchdog stops satl when the MACHINE
# has less than this many megabytes available, whatever satl itself is using.
# With no line here it is UNSET and that check is off -- which is a correction
# to the first satellite, whose default of 4096 killed satl one second after
# startup on any machine with less than 4 GB free.
min_free_mb=2048

# The other three are stored and nothing reads them yet. They are here so the
# file that will configure them is the file that already exists.
#
# division_digits=34     M8 -- significant digits a non-terminating division keeps
# max_depth=2000         M9 -- how deep a program may recurse (DESIGN §7.5)
# float_digits=17        M15 -- the default length of a float's right half (DESIGN §13)
