# broken_config.ini -- a file that must NOT read, and the reason on every line.
#
# THE SAME KIND OF INPUT class_test.satl AND gui_example.satl ARE, and
# FORMAT/CXX.md §6.2 argues why one belongs in this directory: "a file that
# starts parsing is a finding and not a pass", so a file that must fail is an
# acceptance file with the same standing as one that must succeed, and it is a
# prerequisite of the test that reads it.
#
# SEVEN OF THE TEN ROWS IN errors.def's S08xx BLOCK ARE RAISED HERE, and the
# three that are missing cannot be in this file rather than having been
# forgotten:
#
#   S0806, a unit satl does not have, and
#   S0809, a fraction of a unit,
#          both need MEMORY_MAX -- and MEMORY_MAX is spent below on S0805,
#          because it is the only setting in the language that takes a unit at
#          all. A second line naming it would raise S0803 instead, which is a
#          different check.
#   S0891, "twenty problems and the rest was not read", needs twenty-one
#          problems, and a file with twenty-one problems in it is not a
#          demonstration of anything.
#
# tests/limits_test raises both from strings, which is the same answer
# tests/reporter_test gives for the arms no pass produces: build the input by
# hand when a file cannot hold it.

# S0801 -- not NAME=VALUE, a comment, or blank. `.ini` promises sections and
# this format has none.
[machine]

# S0802 -- no such setting, and close enough to a real one to be worth a
# suggestion. The key is not registered, so THREAD_COUNT below is still free.
THREAD_COUNTS=24

# S0807 -- below the smallest it may be. Zero threads is not a pool.
THREAD_COUNT=0

# S0808 -- above the largest. config_internal.hpp measures why the ceiling is
# 1024: a thread costs ~25.6 us to create and the pool is built on every run.
CORE_COUNT=99999

# S0805 -- a size with no unit. 61.9 GiB and 64.9 GB are the same memory.
MEMORY_MAX=48

# S0804 -- a whole number, and this is not one. A DIAL raises it here rather
# than a machine setting, which is the check that dials are read at all.
max_depth=twelve

# Fine, and here so the next two lines have something to be a second of.
division_digits=34

# S0803 and S0890 -- set twice, with a note pointing at the first one.
division_digits=50
