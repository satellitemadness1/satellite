<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
     satl's own fontconfig configuration, spilled beside the fonts it carries.

     NOTE ON STYLE, because it will look wrong to anyone who reads the rest of
     this project: there is not one double hyphen anywhere below. XML forbids
     them inside a comment, and the project's prose uses them constantly. The
     first version of this file had four, and fontconfig answered
     "line 11: not well-formed (invalid token)" and then refused the whole
     config. Em dashes here, double hyphens everywhere else.

     WHY THIS FILE EXISTS. Measured 2026-09-20, running the statically linked
     satl on a machine that HAS fontconfig installed and working:

         Fontconfig error: Cannot load default config file: File not found

     Our freetype and fontconfig are compiled in, so they never read /etc/fonts.
     They look where OUR build was configured to look, which is a path inside the
     build tree and exists on no other machine. WIN-1 described the font problem
     as "embed a font" and warned that the mechanism was not understood at n=2.
     This is the half that was missing: the CONFIG, not just the face. A font with
     no fontconfig to find it is exactly as useful as no font.

     ONE DIRECTORY AND NO SYSTEM PATHS. satl carries its own faces and must not
     depend on the machine having any; that is the point of the whole milestone.

     cachedir is spilled beside the fonts so that a read only or missing
     ~/.cache/fontconfig cannot become a startup failure on somebody else's
     machine.
-->
<fontconfig>
  <description>satl's carried fonts</description>

  <!-- Replaced at spill time with the directory satl wrote the faces into. -->
  <dir>@SATL_FONT_DIR@</dir>
  <cachedir>@SATL_CACHE_DIR@</cachedir>

  <!--
       THE THREE GENERIC FAMILIES ALL RESOLVE TO WHAT WE CARRY. Without these,
       a request for "monospace" (which is what satl-term asks fontconfig for,
       terminal.cpp:125) matches nothing, and pango falls back to a face that is
       not on the machine.
  -->
  <alias><family>monospace</family><prefer><family>IBM Plex Mono</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>IBM Plex Mono</family></prefer></alias>
  <alias><family>serif</family><prefer><family>IBM Plex Mono</family></prefer></alias>

  <!-- A request for a family we do not carry still has to land on something real. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>IBM Plex Mono</string></test>
    <edit name="family" mode="append_last"><string>IBM Plex Mono</string></edit>
  </match>
</fontconfig>
